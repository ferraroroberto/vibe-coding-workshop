<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller de Ejercicios - Presentación</title>
    <link rel="stylesheet" href="slideshow.css">
</head>
<body>
    <div class="slideshow-container" id="slideshow">
        <!-- Slides will be dynamically generated here -->
    </div>

    <div id="qr-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img src="assets/qr.jpg" alt="QR Code" style="border: 5px solid white; border-radius: 5px; max-width: 90vw; max-height: 90vh;">
        </div>
    </div>

    <button class="nav-button prev" onclick="changeSlide(-1)">‹</button>
    <button class="nav-button next" onclick="changeSlide(1)">›</button>
    <div class="slide-counter" id="counter">1 / 1</div>

    <script src="slideshow_data_es.js"></script>
    <script>
        // Special slides (non-exercises)
        const specialSlides = [
            {
                type: 'welcome',
                image: 'assets/welcome.jpg',
                title: 'Welcome'
            },
            {
                type: 'team_agreement',
                image: 'assets/team_agreement.jpg',
                title: 'Team Agreement'
            },
            {
                type: 'menu',
                image: 'assets/menu.jpg',
                title: 'Exercise Menu'
            },
            {
                type: 'break_time',
                image: 'assets/break_time.jpg',
                title: 'Hora de Descanso'
            },
            {
                type: 'survey',
                image: 'assets/survey.jpg',
                title: 'Survey'
            },
            {
                type: 'congratulations',
                image: 'assets/congratulations.jpg',
                title: 'Congratulations'
            },
            {
                type: 'instructions',
                image: 'assets/instructions.jpg',
                title: 'Instrucciones'
            },
            {
                type: 'takeaways',
                image: 'assets/takeaways.jpg',
                title: 'Conclusiones'
            }
        ];


        let currentSlide = 0;
        let menuImageSlideIndex = 0;
        let menuContentSlideIndex = 0;
        let bonusMenuImageSlideIndex = 0;
        let bonusMenuContentSlideIndex = 0;
        let breakTimeSlideIndex = 0;
        let teamAgreementSlideIndex = 0;
        let instructionsSlideIndex = 0;
        let takeawaysSlideIndex = 0;
        let surveySlideIndex = 0;
        let exerciseStartIndex = 0;
        let exerciseEndIndex = 0;
        let bonusExerciseStartIndex = 0;
        let bonusExerciseEndIndex = 0;
        const MENTIMETER_URL = 'https://www.mentimeter.com/app/presentation/alckdi8cc5a56i5d3vt6q712x62py3qf/present?question=h1ir3nj3wgym';
        const slideshow = document.getElementById('slideshow');
        const counter = document.getElementById('counter');

        // Track slide indices for exercises
        const exerciseSlideIndices = [];

        // Convert markdown-like content to HTML
        function markdownToHtml(text) {
            const lines = text.split('\n');
            let result = [];
            let inList = false;
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                // Skip empty lines
                if (!line) {
                    if (inList) {
                        result.push('</ul>');
                        inList = false;
                    }
                    continue;
                }
                
                // Process headers
                if (line.startsWith('### ')) {
                    if (inList) {
                        result.push('</ul>');
                        inList = false;
                    }
                    result.push('<h3>' + processInlineMarkdown(line.substring(4)) + '</h3>');
                } else if (line.startsWith('## ')) {
                    if (inList) {
                        result.push('</ul>');
                        inList = false;
                    }
                    result.push('<h3>' + processInlineMarkdown(line.substring(3)) + '</h3>');
                } else if (line.startsWith('# ')) {
                    if (inList) {
                        result.push('</ul>');
                        inList = false;
                    }
                    result.push('<h2>' + processInlineMarkdown(line.substring(2)) + '</h2>');
                }
                // Process list items
                else if (/^[\d*\-]\.?\s+/.test(line)) {
                    if (!inList) {
                        result.push('<ul>');
                        inList = true;
                    }
                    const listContent = line.replace(/^[\d*\-]\.?\s+/, '');
                    result.push('<li>' + processInlineMarkdown(listContent) + '</li>');
                }
                // Process horizontal rules
                else if (line === '---') {
                    if (inList) {
                        result.push('</ul>');
                        inList = false;
                    }
                    result.push('<hr>');
                }
                // Process regular paragraphs
                else {
                    if (inList) {
                        result.push('</ul>');
                        inList = false;
                    }
                    result.push('<p>' + processInlineMarkdown(line) + '</p>');
                }
            }
            
            if (inList) {
                result.push('</ul>');
            }
            
            return result.join('\n');
        }
        
        function processInlineMarkdown(text) {
            return text
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/`(.+?)`/g, '<code>$1</code>');
        }

        // Generate slides
        function generateSlides() {
            let slideIndex = 0;

            // 1. Welcome slide (no title, just image)
            const welcomeSlide = document.createElement('div');
            welcomeSlide.className = 'slide slide-title';
            welcomeSlide.style.backgroundImage = `url('${specialSlides[0].image}')`;
            slideshow.appendChild(welcomeSlide);
            slideIndex++;

            // 2. Team Agreement slide (no title, just image)
            teamAgreementSlideIndex = slideIndex;
            const teamSlide = document.createElement('div');
            teamSlide.className = 'slide slide-title';
            teamSlide.style.backgroundImage = `url('${specialSlides[1].image}')`;
            teamSlide.innerHTML = `
                <a href="tmp/clip.mp4" target="_blank" class="fullscreen-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                    clip
                </a>
            `;
            slideshow.appendChild(teamSlide);
            slideIndex++;

            // 3. Instrucciones slide (NEW)
            instructionsSlideIndex = slideIndex;
            const instructionsSlide = document.createElement('div');
            instructionsSlide.className = 'slide slide-title';
            // specialSlides[6] is 'instructions'
            instructionsSlide.style.backgroundImage = `url('${specialSlides[6].image}')`;
            slideshow.appendChild(instructionsSlide);
            slideIndex++;

            // 4. Menu slide - Image
            menuImageSlideIndex = slideIndex;
            const menuImageSlide = document.createElement('div');
            menuImageSlide.className = 'slide slide-menu-image';
            menuImageSlide.style.backgroundImage = `url('${specialSlides[2].image}')`;
            slideshow.appendChild(menuImageSlide);
            slideIndex++;

            // 5. Menu slide - Content
            menuContentSlideIndex = slideIndex;
            const menuSlide = document.createElement('div');
            menuSlide.className = 'slide slide-menu';
            menuSlide.style.backgroundImage = `url('${specialSlides[2].image}')`;
            
            let menuItemsHTML = '<div class="menu-grid">';
            mainExercises.forEach((exercise, index) => {
                menuItemsHTML += `
                    <div class="menu-item" onclick="goToExercise(${index})">
                        <div class="menu-item-text">
                            <span class="menu-number">${exercise.number}</span>
                            <span class="menu-title">- ${exercise.title}</span>
                        </div>
                    </div>
                `;
            });
            menuItemsHTML += '</div>';
            
            menuSlide.innerHTML = `
                <div class="content">
                    ${menuItemsHTML}
                    <div class="menu-actions">
                        <button class="menu-action-button" onclick="goToBonusMenu()">Ejercicios Bonus</button>
                        <button class="menu-action-button" onclick="goToBreakTime()">Hora de Descanso</button>
                        <button class="menu-action-button" onclick="goToSurvey()">Finalizar Sesión</button>
                    </div>
                </div>
            `;
            slideshow.appendChild(menuSlide);
            slideIndex++;

            // 6. Generate main exercise slides (title + content for each)
            exerciseStartIndex = slideIndex;
            mainExercises.forEach((exercise, index) => {
                const titleSlide = document.createElement('div');
                titleSlide.className = 'slide slide-title';
                titleSlide.style.backgroundImage = `url('${exercise.image}')`;
                titleSlide.innerHTML = `
                    <div class="content">
                        <div class="exercise-number">${exercise.number}</div>
                        <h1>${exercise.title}</h1>
                    </div>
                `;
                slideshow.appendChild(titleSlide);
                exerciseSlideIndices.push(slideIndex);
                slideIndex++;

                const contentSlide = document.createElement('div');
                contentSlide.className = 'slide slide-content';
                contentSlide.style.backgroundImage = `url('${exercise.image}')`;
                contentSlide.innerHTML = `
                    <div class="timer-container" id="timer-${slideIndex}">
                        <div class="timer-display" id="timer-display-${slideIndex}">00:00</div>
                        <button class="timer-btn" onclick="toggleTimer(${slideIndex})">
                            <svg id="timer-svg-${slideIndex}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                        </button>
                    </div>
                    <div class="exercise-actions">
                        <button class="exercise-action-button" onclick="goToMenu()">← Menú</button>
                        <button class="exercise-action-button" onclick="goToBreakTime()">Hora de Descanso</button>
                        <button class="exercise-action-button" onclick="goToSurvey()">Finalizar Sesión</button>
                    </div>
                    <div class="content">
                        ${markdownToHtml(exercise.content)}
                    </div>
                `;
                slideshow.appendChild(contentSlide);
                exerciseSlideIndices.push(slideIndex);
                slideIndex++;
            });
            exerciseEndIndex = slideIndex - 1;

            // 7. Bonus menu - Image
            bonusMenuImageSlideIndex = slideIndex;
            const bonusMenuImageSlide = document.createElement('div');
            bonusMenuImageSlide.className = 'slide slide-menu-image';
            bonusMenuImageSlide.style.backgroundImage = `url('assets/menu_bonus.jpg')`;
            slideshow.appendChild(bonusMenuImageSlide);
            slideIndex++;

            // 8. Bonus menu - Content
            bonusMenuContentSlideIndex = slideIndex;
            const bonusMenuSlide = document.createElement('div');
            bonusMenuSlide.className = 'slide slide-menu';
            bonusMenuSlide.style.backgroundImage = `url('assets/menu_bonus.jpg')`;
            let bonusMenuItemsHTML = '<h2 style="color: white; margin-bottom: 1rem;">Ejercicios Bonus</h2><div class="menu-grid">';
            bonusExercises.forEach((exercise, index) => {
                bonusMenuItemsHTML += `
                    <div class="menu-item" onclick="goToBonusExercise(${index})">
                        <div class="menu-item-text">
                            <span class="menu-number">${exercise.number}</span>
                            <span class="menu-title">- ${exercise.title}</span>
                        </div>
                    </div>
                `;
            });
            bonusMenuItemsHTML += '</div>';
            bonusMenuSlide.innerHTML = `
                <div class="content">
                    ${bonusMenuItemsHTML}
                    <div class="menu-actions">
                        <button class="menu-action-button" onclick="goToMenu()">← Volver al Menú</button>
                        <button class="menu-action-button" onclick="goToBreakTime()">Hora de Descanso</button>
                        <button class="menu-action-button" onclick="goToSurvey()">Finalizar Sesión</button>
                    </div>
                </div>
            `;
            slideshow.appendChild(bonusMenuSlide);
            slideIndex++;

            // 9. Bonus exercise slides (title + content for each)
            bonusExerciseStartIndex = slideIndex;
            bonusExercises.forEach((exercise, index) => {
                const titleSlide = document.createElement('div');
                titleSlide.className = 'slide slide-title';
                titleSlide.style.backgroundImage = `url('${exercise.image}')`;
                titleSlide.innerHTML = `
                    <div class="content">
                        <div class="exercise-number">${exercise.number}</div>
                        <h1>${exercise.title}</h1>
                    </div>
                `;
                slideshow.appendChild(titleSlide);
                slideIndex++;

                const contentSlide = document.createElement('div');
                contentSlide.className = 'slide slide-content';
                contentSlide.style.backgroundImage = `url('${exercise.image}')`;
                contentSlide.innerHTML = `
                    <div class="timer-container" id="timer-${slideIndex}">
                        <div class="timer-display" id="timer-display-${slideIndex}">00:00</div>
                        <button class="timer-btn" onclick="toggleTimer(${slideIndex})">
                            <svg id="timer-svg-${slideIndex}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                        </button>
                    </div>
                    <div class="exercise-actions">
                        <button class="exercise-action-button" onclick="goToBonusMenu()">← Menú Bonus</button>
                        <button class="exercise-action-button" onclick="goToMenu()">← Menú Principal</button>
                        <button class="exercise-action-button" onclick="goToBreakTime()">Hora de Descanso</button>
                        <button class="exercise-action-button" onclick="goToSurvey()">Finalizar Sesión</button>
                    </div>
                    <div class="content">
                        ${markdownToHtml(exercise.content)}
                    </div>
                `;
                slideshow.appendChild(contentSlide);
                slideIndex++;
            });
            bonusExerciseEndIndex = slideIndex - 1;

            // 10. Hora de Descanso slide (no title, just image)
            breakTimeSlideIndex = slideIndex;
            const breakSlide = document.createElement('div');
            breakSlide.className = 'slide slide-title';
            breakSlide.style.backgroundImage = `url('${specialSlides[3].image}')`;
            breakSlide.innerHTML = `
                <div class="exercise-actions" style="position: absolute; top: 1rem; right: 1rem;">
                    <button class="exercise-action-button" onclick="goToBonusMenu()">← Volver al Bonus</button>
                    <button class="exercise-action-button" onclick="goToMenu()">← Volver al Menú</button>
                </div>
            `;
            slideshow.appendChild(breakSlide);
            slideIndex++;

            // 11. Conclusiones slide (NEW) - before Survey
            takeawaysSlideIndex = slideIndex;
            const takeawaysSlide = document.createElement('div');
            takeawaysSlide.className = 'slide slide-title';
            // specialSlides[7] is 'takeaways'
            takeawaysSlide.style.backgroundImage = `url('${specialSlides[7].image}')`;
            // Add prominent button to go to Survey
            takeawaysSlide.innerHTML = `
                <a onclick="window.open(MENTIMETER_URL, '_blank')" class="fullscreen-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                    Menti
                </a>
                <div class="exercise-actions" style="position: absolute; bottom: 3rem; right: 3rem; transform: scale(1.5); display: flex; flex-direction: column; gap: 1rem;">
                    <button class="exercise-action-button" onclick="window.open(MENTIMETER_URL, '_blank')">Menti</button>
                    <button class="exercise-action-button" style="background: rgba(100, 181, 246, 0.9); color: #000;" onclick="goToRealSurvey()">Ir a la Encuesta →</button>
                </div>
            `;
            slideshow.appendChild(takeawaysSlide);
            slideIndex++;

            // 12. Survey slide (no title, just image)
            surveySlideIndex = slideIndex;
            const surveySlide = document.createElement('div');
            surveySlide.className = 'slide slide-title';
            surveySlide.style.backgroundImage = `url('${specialSlides[4].image}')`;
            surveySlide.innerHTML = `
                <a onclick="showQR()" class="fullscreen-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                    QR
                </a>
            `;
            slideshow.appendChild(surveySlide);
            slideIndex++;

            // 13. Congratulations slide (no title, just image)
            const congratsSlide = document.createElement('div');
            congratsSlide.className = 'slide slide-title';
            congratsSlide.style.backgroundImage = `url('${specialSlides[5].image}')`;
            slideshow.appendChild(congratsSlide);
            slideIndex++;

            // Initialize first slide
            const slides = slideshow.querySelectorAll('.slide');
            if (slides.length > 0) {
                slides[0].classList.add('active');
            }
            updateCounter();
        }

        function showSlide(index) {
            const slides = slideshow.querySelectorAll('.slide');
            slides[currentSlide].classList.remove('active');
            currentSlide = index;
            slides[currentSlide].classList.add('active');
            updateCounter();
        }

        function goToExercise(exerciseIndex) {
            showSlide(exerciseStartIndex + (exerciseIndex * 2));
        }

        function goToMenu() {
            showSlide(menuContentSlideIndex);
        }

        function goToBonusMenu() {
            showSlide(bonusMenuContentSlideIndex);
        }

        function goToBonusExercise(bonusIndex) {
            showSlide(bonusExerciseStartIndex + (bonusIndex * 2));
        }

        function goToBreakTime() {
            showSlide(breakTimeSlideIndex);
        }

        function goToSurvey() {
            showSlide(takeawaysSlideIndex);
        }

        function goToRealSurvey() {
            showSlide(surveySlideIndex);
        }

        function changeSlide(direction) {
            const slides = slideshow.querySelectorAll('.slide');
            slides[currentSlide].classList.remove('active');
            
            currentSlide += direction;
            
            if (currentSlide < 0) {
                currentSlide = slides.length - 1;
            } else if (currentSlide >= slides.length) {
                currentSlide = 0;
            }
            
            slides[currentSlide].classList.add('active');
            updateCounter();
        }

        function updateCounter() {
            resetAllTimers();
            const slides = slideshow.querySelectorAll('.slide');
            counter.textContent = `${currentSlide + 1} / ${slides.length}`;
        }

        // Timer Logic
        const timers = {};

        function toggleTimer(slideIndex) {
            if (!timers[slideIndex]) {
                timers[slideIndex] = {
                    seconds: 0,
                    interval: null,
                    isRunning: false
                };
            }

            const timer = timers[slideIndex];
            const display = document.getElementById(`timer-display-${slideIndex}`);
            const btn = document.querySelector(`#timer-${slideIndex} .timer-btn`);
            const svg = document.querySelector(`#timer-${slideIndex} svg`);

            if (timer.isRunning) {
                // Stop
                clearInterval(timer.interval);
                timer.isRunning = false;
                // Show Play icon
                svg.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
            } else {
                // Start
                timer.isRunning = true;
                // Show Pause icon
                svg.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
                
                timer.interval = setInterval(() => {
                    timer.seconds++;
                    const mins = Math.floor(timer.seconds / 60);
                    const secs = timer.seconds % 60;
                    display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }, 1000);
            }
        }

        function resetAllTimers() {
            Object.keys(timers).forEach(index => {
                const timer = timers[index];
                if (timer.interval) clearInterval(timer.interval);
                timer.seconds = 0;
                timer.isRunning = false;
                timer.interval = null;

                const display = document.getElementById(`timer-display-${index}`);
                if (display) display.textContent = "00:00";
                
                const svg = document.querySelector(`#timer-${index} svg`);
                if (svg) svg.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
            });
            // Clear the logic state but maybe keep the key? actually fine to keep
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                changeSlide(-1);
            } else if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                changeSlide(1);
            } else if (e.key === 'b' || e.key === 'B') {
                // Context-specific action
                if (currentSlide === takeawaysSlideIndex) { // open Mentimeter
                    window.open(MENTIMETER_URL, '_blank');
                } else if (currentSlide >= exerciseStartIndex && currentSlide <= exerciseEndIndex) { // exercise slides: back to menu
                    goToMenu();
                } else if (currentSlide >= bonusExerciseStartIndex && currentSlide <= bonusExerciseEndIndex) { // bonus slides: back to bonus menu
                    goToBonusMenu();
                } else if (currentSlide === teamAgreementSlideIndex) { // Team Agreement - open video
                    window.open('tmp/clip.mp4', '_blank');
                } else if (currentSlide === surveySlideIndex) { // toggle QR
                    const qrModal = document.getElementById('qr-modal');
                    if (qrModal.style.display === 'block') {
                        qrModal.style.display = 'none';
                    } else {
                        showQR();
                    }
                }
            }
        });

        // Touch/swipe support for mobile
        let touchStartX = 0;
        let touchEndX = 0;

        slideshow.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        slideshow.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                changeSlide(1); // Swipe left = next
            }
            if (touchEndX > touchStartX + 50) {
                changeSlide(-1); // Swipe right = previous
            }
        }

        function showQR() {
            document.getElementById('qr-modal').style.display = 'block';
        }

        document.querySelector('.close').addEventListener('click', function() {
            document.getElementById('qr-modal').style.display = 'none';
        });

        window.addEventListener('click', function(event) {
            if (event.target == document.getElementById('qr-modal')) {
                document.getElementById('qr-modal').style.display = 'none';
            }
        });

        // Initialize slideshow
        generateSlides();
    </script>
</body>
</html>
