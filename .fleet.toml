# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "working-web"
icon        = "🎓"
description = "Python workshop + exercises."

# [vendored] -- components copied byte-for-byte from project-scaffolding, with the
# scaffold commit each came from. Re-vendor through /propagate-vendored, never by hand.
[vendored]
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "84d2b12ab416551762e4a615e4a706df91cea69f", dest = "scripts/structure_ratchet.py" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "60fdd0350f18d28838428b2e773f7868f6381fbf", dest = "scripts/instruction_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "23dbefa46635c952d3c871bda4e80b740e7f2859", dest = "scripts/doc_refs_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "0eb0da42298e391fc614b3fe550bd6cf2d07c693", dest = "scripts/dead_code_ratchet.py" }

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage.
# scripts/verify-before-ship.ps1 runs scripts/structure_ratchet.py, which fails when a
# new file passes 1,000 lines, a new function 100 lines or a flat directory 40 modules,
# and when a baselined offender grows past its size in .structure-ratchet-baseline.json.
# Existing offenders are baselined at today's size, never excluded. Exit 3 (git unusable,
# an unparseable file) fails the gate. No `shape` is declared: the workshop content
# (slides, exercises, demos) fits no preset, so the root layout check reports not applicable.
# Procedure: project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"
# Exercise solutions are teaching material, written long on purpose.
exclude  = ["exercises/**"]

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet stage for agent instruction files.
# scripts/verify-before-ship.ps1 runs scripts/instruction_ratchet.py over CLAUDE.md and
# AGENTS.md (this repo ships no skills or rules files) and fails when a rule hit count
# rises above .instruction-ratchet-baseline.json or a file passes its size cap. Existing
# hits are baselined, never excluded. Exit 3 fails the gate as NOT CONFIRMED.
# Procedure: project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet stage for stale doc references.
# scripts/verify-before-ship.ps1 runs scripts/doc_refs_ratchet.py, which fails when
# README.md, CLAUDE.md or docs/ names a repo path, module, relative link or loopback port
# that does not exist, beyond the shrink-only .doc-refs-ratchet-baseline.json. Existing
# stale references are baselined, never excluded. Exit 3 fails the gate as NOT CONFIRMED.
# Procedure: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled  = true
baseline = ".doc-refs-ratchet-baseline.json"

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet stage for unreferenced Python.
# scripts/verify-before-ship.ps1 runs scripts/dead_code_ratchet.py, which fails when a new
# function, class or method appears that nothing in the repo refers to, beyond the
# shrink-only .dead-code-ratchet-baseline.json. Existing dead code is baselined (or, for
# deliberate teaching code, allowed), never excluded. Exit 3 fails the gate as NOT CONFIRMED.
# Procedure: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"
# An exercise solution keeps this helper uncalled on purpose. It is allowed rather than
# baselined: a tracked baseline names the function in a .json file, which the ratchet reads
# as a reference, so the entry would mask itself.
allow    = ["exercises/viz_d3_bar_chart/exercise_solution.py:collect_products"]
