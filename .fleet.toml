# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "working-web"
icon        = "🎓"
description = "Python workshop + exercises."

# [vendored] -- components copied byte-for-byte from project-scaffolding, with the
# scaffold commit each came from. Re-vendor through /propagate-vendored, never by hand.
[vendored]
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "3b708fd3c54ab7b93b08d489406c405762c83c41", dest = "scripts/structure_ratchet.py" }
structure_layout = { src = "scripts/structure_layout.py", sha = "713b1d1e36989440679ec4e415ff149b14d96c81", dest = "scripts/structure_layout.py" }
structure_band = { src = "scripts/structure_band.py", sha = "3b708fd3c54ab7b93b08d489406c405762c83c41", dest = "scripts/structure_band.py" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "9d0fd2777fbae78aaffa7a0e53f62a201db5af79", dest = "scripts/instruction_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/doc_refs_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/dead_code_ratchet.py" }
static_ratchet = { src = "scripts/static_ratchet.py", sha = "9f5ba3bdfb62265908d2b6c1c5436da792f981b3", dest = "scripts/static_ratchet.py" }
docs_ratchet = { src = "scripts/docs_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/docs_ratchet.py" }
comment_ratchet = { src = "scripts/comment_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/comment_ratchet.py" }
conventions_ratchet = { src = "scripts/conventions_ratchet.py", sha = "9d0fd2777fbae78aaffa7a0e53f62a201db5af79", dest = "scripts/conventions_ratchet.py" }

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage.
# scripts/verify-before-ship.ps1 runs scripts/structure_ratchet.py, which fails when a
# new file passes 1,000 lines, a new function 100 lines or a flat directory 40 modules,
# and when a baselined offender grows past its size in .structure-ratchet-baseline.json.
# Existing offenders are baselined at today's size, never excluded. Exit 3 (git unusable,
# an unparseable file) fails the gate. No `shape` is declared: the workshop content
# (slides, exercises, demos) fits no preset, so the root layout check reports not applicable.
# Procedure: project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"
# Exercise solutions are teaching material, written long on purpose.
exclude  = ["exercises/**"]

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet stage for agent instruction files.
# scripts/verify-before-ship.ps1 runs scripts/instruction_ratchet.py over CLAUDE.md and
# AGENTS.md (this repo ships no skills or rules files) and fails when a rule hit count
# rises above .instruction-ratchet-baseline.json or a file passes its size cap. Existing
# hits are baselined, never excluded. Exit 3 fails the gate as NOT CONFIRMED.
# Procedure: project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet stage for stale doc references.
# scripts/verify-before-ship.ps1 runs scripts/doc_refs_ratchet.py, which fails when
# README.md, CLAUDE.md or docs/ names a repo path, module, relative link or loopback port
# that does not exist, beyond the shrink-only .doc-refs-ratchet-baseline.json. Existing
# stale references are baselined, never excluded. Exit 3 fails the gate as NOT CONFIRMED.
# Procedure: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled  = true
baseline = ".doc-refs-ratchet-baseline.json"

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet stage for unreferenced Python.
# scripts/verify-before-ship.ps1 runs scripts/dead_code_ratchet.py, which fails when a new
# function, class or method appears that nothing in the repo refers to, beyond the
# shrink-only .dead-code-ratchet-baseline.json. Existing dead code is baselined (or, for
# deliberate teaching code, allowed), never excluded. Exit 3 fails the gate as NOT CONFIRMED.
# Procedure: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"
# An exercise solution keeps this helper uncalled on purpose. It is allowed rather than
# baselined: a tracked baseline names the function in a .json file, which the ratchet reads
# as a reference, so the entry would mask itself.
allow    = ["exercises/viz_d3_bar_chart/exercise_solution.py:collect_products"]

# [static_ratchet] -- the scaffold's baseline-and-ratchet stage for duplicated and unused code.
# scripts/verify-before-ship.ps1 runs scripts/static_ratchet.py, which fails on a new
# duplicated block (jscpd, through npx), unused import or variable, or likely-bug and
# security finding (ruff) beyond the shrink-only .static-ratchet-baseline.json. Existing
# findings are baselined, never excluded. Exit 3 (no npx, no ruff, unparseable output) fails
# the gate as NOT CONFIRMED. Vendored scripts are left out automatically.
# Procedure: project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"

# [docs_ratchet] -- the scaffold's baseline-and-ratchet stage for README and docs hygiene.
# scripts/verify-before-ship.ps1 runs scripts/docs_ratchet.py, which fails when the root
# README.md grows past its size budget or README.md / docs/**/*.md gain history markers
# (issue references, dated headings, changelog headings) beyond the shrink-only
# .docs-ratchet-baseline.json. Existing debt is baselined, never excluded. Exit 3 fails the
# gate as NOT CONFIRMED.
# Procedure: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [comment_ratchet] -- the scaffold's baseline-and-ratchet stage for history comments.
# scripts/verify-before-ship.ps1 runs scripts/comment_ratchet.py, which counts issue
# references (#NNN) inside Python, JS, CSS and PowerShell comments per file and fails when a
# file's count rises above the shrink-only .comment-ratchet-baseline.json. Existing
# references are baselined, never excluded. Exit 3 (a file that cannot be scanned) fails the
# gate as NOT CONFIRMED.
# Procedure: project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet stage for fleet conventions.
# scripts/verify-before-ship.ps1 runs scripts/conventions_ratchet.py, which counts each
# enabled rule's hits per tracked Python file and fails when a file's count for a rule rises
# above the shrink-only .conventions-ratchet-baseline.json. Existing hits are baselined or
# carry a reasoned exempt marker. Exit 3 (git unusable, an unparseable file) fails the gate
# as NOT CONFIRMED.
# Rules enabled: no-window (the build and facilitator scripts spawn Playwright, Streamlit and
# other child processes on Windows) and no-drive-path (workshop content must not hardcode a
# location). Rules left off: logging-not-print (its scope is app/ and src/, which this repo
# does not have, and the exercises print by design), secret-compare and git-wrapper (the
# repo has neither helper).
# Procedure: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "no-drive-path"]
